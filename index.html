<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="app.title">Accessible File Explorer</title>
  </head>
  <body>
    <!--
      One persistent layout: the location is always first, the contents always
      follow. Popups are native modal dialogs layered on top. Every visible
      string is filled in from src/i18n at startup.
    -->
    <header class="location-bar">
      <nav id="location" aria-labelledby="location-label">
        <span id="location-label" class="location-label" data-i18n="location.label"
          >Current location</span
        >
        <ol id="breadcrumbs" class="breadcrumbs"></ol>
        <input
          id="location-input"
          class="location-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-label="Type a location"
          hidden
        />
      </nav>
      <button
        id="search-button"
        class="icon-button search-button"
        type="button"
        aria-label="Search"
      ></button>
    </header>

    <main class="content">
      <!-- Visual column titles only; each row's description carries the same facts -->
      <div class="list-header" aria-hidden="true">
        <span data-i18n="columns.name">Name</span>
        <span data-i18n="columns.size">Size</span>
        <span data-i18n="columns.modified">Modified</span>
      </div>
      <div id="file-list" class="file-list" role="tree" aria-label="Loading…" aria-busy="true">
        <div class="file-list-rows" role="none"></div>
      </div>
    </main>

    <dialog id="search-dialog" class="popup" aria-labelledby="search-title">
      <h2 id="search-title" class="popup-title" data-i18n="search.dialogLabel">Search</h2>
      <input
        id="search-input"
        class="popup-input"
        type="search"
        role="searchbox"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search"
      />
    </dialog>

    <dialog id="palette-dialog" class="popup" aria-labelledby="palette-title">
      <h2 id="palette-title" class="popup-title" data-i18n="palette.dialogLabel">Commands</h2>
      <input
        id="palette-input"
        class="popup-input"
        type="text"
        role="combobox"
        autocomplete="off"
        spellcheck="false"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="palette-list"
        aria-label="Command"
      />
      <ul id="palette-list" class="popup-list" role="listbox" aria-label="Commands" hidden></ul>
    </dialog>

    <dialog id="bookmarks-dialog" class="popup" aria-labelledby="bookmarks-title">
      <h2 id="bookmarks-title" class="popup-title" data-i18n="bookmarks.dialogLabel">Bookmarks</h2>
      <ul
        id="bookmarks-list"
        class="popup-list"
        role="listbox"
        tabindex="0"
        aria-label="Bookmarks"
      ></ul>
    </dialog>

    <div
      id="status-announcer"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="error-announcer"
      class="visually-hidden"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    ></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
